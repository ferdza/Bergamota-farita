# Chlorophyll (ry-diffusion/Chlorophyll, the GPU userland: Turnip + the AIR frontend + the Metal device) for the phone, built on a
# macOS runner because it needs Xcode's iPhoneOS SDK and the metal compiler. Everything is built from source here: Mesa 26.2.5 with
# Chlorophyll's patches, libdrm 2.4.124 headers, this repository's gpu/freedreno-sweet (libdrm stand-in) and tools/renegade/pacstrip.py.
# Nothing from Apple or Qualcomm goes into the artifact. Output: chlorophyll-ios18.zip laid out as the paths it is installed to.
name: chlorophyll (iOS 18, Turnip)

on:
  workflow_dispatch:
    inputs:
      chlorophyll_ref:
        description: Chlorophyll branch, tag or commit
        default: ios26
      xcode_version:
        description: Xcode on the runner (empty = the newest; Chlorophyll's Metal device needs the iOS 26 SDK, binaries still target iOS 18.0)
        default: ""

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      WORK: ${{ github.workspace }}/work
    steps:
      - uses: actions/checkout@v4

      - name: Chlorophyll source
        run: |
          git clone -q https://github.com/ry-diffusion/Chlorophyll "$WORK/chlorophyll"
          git -C "$WORK/chlorophyll" checkout -q "${{ inputs.chlorophyll_ref }}"
          git -C "$WORK/chlorophyll" log --oneline -1
          git clone -q --depth 1 --branch libdrm-2.4.124 https://gitlab.freedesktop.org/mesa/drm.git "$WORK/libdrm-src"

      - name: Xcode
        run: |
          if [ -n "${{ inputs.xcode_version }}" ]; then
            XC=$(ls -d /Applications/Xcode_${{ inputs.xcode_version }}*.app | sort -V | tail -1)
          else
            XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          fi
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Tools
        run: |
          brew install bison glslang pkg-config ninja
          python3 -m venv "$WORK/venv"
          "$WORK/venv/bin/pip" install -q meson mako pyyaml packaging pycparser ply

      - name: Turnip + libchlorophyll
        env:
          GPU_METAL_WORK: ${{ github.workspace }}/work
          BERGAMOTA_GPU: ${{ github.workspace }}/gpu
          GPU_EAGL_LIBDRM: ${{ github.workspace }}/work/libdrm-src
          GPU_EAGL_VENV: ${{ github.workspace }}/work/venv
          JOBS: "4"
        run: |
          bash "$WORK/chlorophyll/turnip/build-turnip.sh" || { tail -80 "$WORK/mesa-turnip26/setup-ios.log" 2>/dev/null; exit 1; }

      - name: Metal device, inject, tests
        env:
          GPU_METAL_WORK: ${{ github.workspace }}/work
          BERGAMOTA_GPU: ${{ github.workspace }}/gpu
        run: |
          bash "$WORK/chlorophyll/turnip/build-metal.sh" "$WORK/out-metal"
          bash "$WORK/chlorophyll/turnip/build-chl-test.sh" "$WORK/out-chl"
          bash "$WORK/chlorophyll/turnip/build-test.sh" "$WORK/out-turnip"

      - name: Package
        run: |
          P="$WORK/pkg"; mkdir -p "$P/usr/local/lib/bgmtl" "$P/var/root/chl-test" "$P/var/root/turnip-test" "$P/var/root/metal-turnip" "$P/LICENSES"
          cp "$WORK/out-metal/bgmtl-inject.dylib" "$WORK/out-metal/libchlorophyll.dylib" "$WORK/out-metal/libdrm.2.dylib" "$P/usr/local/lib/bgmtl/"
          cp "$WORK/out-chl/"* "$P/var/root/chl-test/"
          cp "$WORK/out-turnip/tu_smoke" "$WORK/out-turnip/libvulkan_freedreno.dylib" "$WORK/out-turnip/libdrm.2.dylib" "$P/var/root/turnip-test/"
          for f in "$WORK/out-metal/"*; do case "$f" in *.o|*.air) ;; *) cp "$f" "$P/var/root/metal-turnip/" ;; esac; done
          rm -f "$P"/var/root/*/*.o "$P"/var/root/*/*.air
          cp "$WORK/mesa-turnip26/mesa/docs/license.rst" "$P/LICENSES/Mesa-license.rst"
          cp "$WORK/libdrm-src/COPYING" "$P/LICENSES/libdrm-COPYING" 2>/dev/null || true
          for f in NOTICE.md LICENSE.hackios-userland; do cp "$WORK/chlorophyll/$f" "$P/LICENSES/Chlorophyll-$f" 2>/dev/null || true; done
          {
            echo "Chlorophyll $(git -C "$WORK/chlorophyll" rev-parse --short HEAD) (${{ inputs.chlorophyll_ref }}), Bergamota-farita $(git rev-parse --short HEAD)"
            echo "Xcode: $(xcodebuild -version | head -1), iPhoneOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"
            echo "Built by GitHub Actions run ${{ github.run_id }}"
            echo
            echo "Tests (no system change): /var/root/turnip-test/tu_smoke, /var/root/chl-test/chl_test bg_kernels.metallib bg_render.metallib"
            echo "System install (backboardd etc. on the GPU): /usr/local/lib/bgmtl/* - only with the user's OK."
            echo
            (cd "$P" && find . -type f ! -name BUILD.txt | sort | xargs shasum -a 256)
          } > "$P/BUILD.txt"
          cat "$P/BUILD.txt"
          (cd "$P" && zip -qr "$WORK/chlorophyll-ios18.zip" .)
          ls -l "$WORK/chlorophyll-ios18.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: chlorophyll-ios18
          path: work/chlorophyll-ios18.zip
          retention-days: 30
