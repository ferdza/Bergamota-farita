name: web (GitHub Pages)

# Build apps/web (the browser flasher / control plane) and publish it to GitHub
# Pages — free static hosting with HTTPS (WebUSB needs a secure context, which
# Pages provides). The site is served under the repo sub-path, so the build sets
# BERGA_BASE=/<repo>/. One-time setup: repo Settings -> Pages -> Source = GitHub
# Actions. URL: https://<owner>.github.io/<repo>/  (the flasher at .../flash/).

on:
  push:
    branches: [fajita]
    paths:
      - "apps/web/**"
      - "tools/renegade-wasm/**"
      - "tools/renegade-rs/**"
      - "tools/berga-tools/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rust + wasm target (for the Renegade WASM patcher)
        run: rustup target add wasm32-unknown-unknown
      - name: Install web deps
        working-directory: apps/web
        run: npm ci
      # The on-device tools bundle (SSH server dropbear, first-boot helpers, GL payload), built by upstream
      # from this repository and published as a berga-tools-vN release. The patcher fetches it from
      # <site>/tools/berga-tools.zip; without it the root gets NO SSH server (first fajita boot, 2026-11-04).
      - name: Fetch berga-tools (on-device SSH + helpers)
        working-directory: apps/web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/fetch-tools.sh
          ls -l public/tools/
      # The GPU on by default: Chlorophyll (release chlorophyll-ios18 of this repository, built by chlorophyll.yml) goes into
      # the bundle as bgmtl/*, so the patched root has the Metal driver and backboardd wired to it. Without that release the
      # root is built without the GPU userland (Renegade logs it) and the page still works.
      - name: Add Chlorophyll (GPU 3D by default) to berga-tools
        working-directory: apps/web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/chl"
          if gh release download chlorophyll-ios18 -R "${{ github.repository }}" -p chlorophyll-ios18.zip -D "$RUNNER_TEMP/chl" --clobber; then
            python3 ../../tools/berga-tools/add-chlorophyll.py public/tools/berga-tools.zip "$RUNNER_TEMP/chl/chlorophyll-ios18.zip"
          else
            echo "::warning::no chlorophyll-ios18 release yet (run the chlorophyll workflow): the root will have no GPU userland"
          fi
      - name: Build (base = /${{ github.event.repository.name }}/)
        working-directory: apps/web
        env:
          BERGA_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
